spring:
  datasource:
    url: jdbc:h2:mem:posts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration,classpath:db/h2

jwt:
  # 테스트 전용 키입니다. 운영 키는 JWT_SECRET 환경 변수로만 주입합니다.
  secret: BTi4qtHFr8BRN4+VjjGagRTx4E1F0lS82qhRyF921y4=
  access-token-expiration: 30m
