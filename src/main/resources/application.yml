spring:
  jackson:
    deserialization:
      # 정수 필드로 보낸 소수를 절삭해 다른 값으로 처리하지 않습니다.
      accept-float-as-int: false
    datatype:
      enum:
        # enum은 공개 문자열 값으로만 받고 선언 순번으로 해석하지 않습니다.
        fail-on-numbers-for-enums: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assignment}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration,classpath:db/postgresql
    default-schema: public
    baseline-on-migrate: false
    clean-disabled: true

server:
  # Nginx가 전달한 X-Forwarded-* 헤더를 반영해 HTTPS 기준 URL을 생성합니다.
  forward-headers-strategy: framework

app:
  cors:
    # 쉼표로 여러 프론트엔드 Origin을 지정할 수 있습니다. 운영에서는 반드시 실제 HTTPS 주소로 덮어씁니다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  packages-to-scan: org.sopt
  override-with-generic-response: false

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  theme: DEEP_SPACE
  show-operation-id: true
  operation-title-source: summary
  default-open-first-tag: false
  schema-property-order: alpha
  dark-mode: true
