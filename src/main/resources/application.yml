spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assignment}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    clean-disabled: true

springdoc:
  packages-to-scan: org.sopt
  override-with-generic-response: false

scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  theme: DEEP_SPACE
  show-operation-id: true
  operation-title-source: summary
  default-open-first-tag: false
  schema-property-order: alpha
  dark-mode: true
