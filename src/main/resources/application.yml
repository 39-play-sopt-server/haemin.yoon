spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assignment}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    clean-disabled: true
