plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.5.1'
}

group = 'org.sopt'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    flywayCli
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    flywayCli 'org.flywaydb:flyway-commandline'
    flywayCli 'org.flywaydb:flyway-database-postgresql'
    flywayCli 'org.postgresql:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        googleJavaFormat('1.28.0')
        removeUnusedImports()
    }
}

tasks.named('bootRun') {
    dependsOn tasks.named('spotlessCheck')
}

tasks.register('flywayBaseline', JavaExec) {
    group = 'database'
    description = 'Register an existing public schema as version 1 without running migrations.'
    classpath = configurations.flywayCli
    mainClass = 'org.flywaydb.commandline.Main'
    args 'baseline', '-baselineVersion=1', '-schemas=public'
    doFirst {
        def dbUrl = System.getenv('DB_URL')
        if (!dbUrl) {
            throw new GradleException('Set DB_URL explicitly after checking the target schema and backup. See docs/flyway.md.')
        }
        environment 'FLYWAY_URL', dbUrl
        environment 'FLYWAY_USER', System.getenv('DB_USERNAME') ?: System.getProperty('user.name')
        environment 'FLYWAY_PASSWORD', System.getenv('DB_PASSWORD') ?: ''
    }
}
